name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  colcon-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: mirs
          target-ros2-distro: jazzy
          vcs-repo-file-url: file://${{ github.workspace }}/.github/workflows/mirs.repos
          rosdep-skip-keys: micro_ros_agent micro_ros_msgs sllidar_ros2 opennav_coverage opennav_coverage_navigator opennav_coverage_bt

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest test/ -q
